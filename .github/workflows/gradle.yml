# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle Wrapper
      run: ./gradlew clean build

    # Run our tests
    - name: Run tests
      run: ./gradlew test  

    # Upload our StockLib
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: Upload libs
        path: lib/build/libs/*.jar
        if-no-files-found: error

    - name: Check tag matches Gradle version
      if: github.ref_type == 'tag'
      run: |
        GRADLE_VERSION=$(./gradlew -q :lib:properties | awk '/^version:/ {print $2}')
        TAG_VERSION="${GITHUB_REF_NAME#v}"

        echo "Gradle version: $GRADLE_VERSION"
        echo "Tag version: $TAG_VERSION"

        if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
          echo "Version mismatch: tag is $TAG_VERSION but Gradle version is $GRADLE_VERSION"
          exit 1
        fi

    - name: Create GitHub Release with JAR
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        JARS=(lib/build/libs/*.jar)

        if [ ! -e "${JARS[0]}" ]; then
          echo "No JAR files found in lib/build/libs"
          exit 1
        fi

        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "${JARS[@]}" --clobber
        else
          gh release create "$GITHUB_REF_NAME" "${JARS[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        fi
